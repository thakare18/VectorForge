name: Render keep-alive

on:
  schedule:
    # Every ten minutes, avoiding the busier start of the hour. Schedule is best-effort.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    # Standard public-repo runners are free. Skip private repos and forks before allocation.
    if: ${{ github.event.repository.private == false && github.event.repository.fork == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read the health-check script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Ping public backend health endpoint
        env:
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: node scripts/render-keepalive.cjs
